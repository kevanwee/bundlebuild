[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bundlebuild"
version = "0.1.0"
description = "Build court bundles from a YAML index: merge PDFs, stamp continuous page numbers, generate a hyperlinked index and PDF bookmarks, and pre-flight the inputs. Library, CLI and MCP server."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "pypdf>=4.0",
  "reportlab>=4.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "ruff>=0.5", "mcp>=1.2"]

[project.scripts]
bundlebuild = "bundlebuild.cli:main"
bundlebuild-mcp = "bundlebuild.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
